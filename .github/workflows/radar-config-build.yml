name: Radar Config Android build

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/radar-config-discovery, fix/radar-vpn-full-restoration, not-SIGNAL/NOT-NET]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK available on hosted runners
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Use installed compile SDK for CI validation
        run: sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts

      # The project validates release signing during Gradle configuration, even for
      # assembleDebug. Create a throwaway CI-only key; never use it for distribution.
      - name: Create temporary CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore ci-temporary.keystore \
            -storepass ci-temporary-password \
            -keypass ci-temporary-password \
            -alias ci-temporary \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Temporary CI Build, OU=CI, O=G-ST-VPN, L=CI, ST=CI, C=US"
          cat > keystore.properties <<'EOF'
          storeFile=ci-temporary.keystore
          storePassword=ci-temporary-password
          keyAlias=ci-temporary
          keyPassword=ci-temporary-password
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest -x :app:checkDebugAarMetadata

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: radar-config-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
